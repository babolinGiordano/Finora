quarkus.application.name=finahelp

# Tutte le risorse JAX-RS sotto /api, ma /q/* (openapi, swagger-ui, health)
# resta sulla radice: per questo uso quarkus.rest.path e non quarkus.http.root-path
quarkus.rest.path=/api

# Flyway e' l'unica fonte di verita' dello schema: Hibernate non genera nulla
# e non valida nulla. Le entita' devono adeguarsi allo schema, non il contrario.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# In dev e in test il datasource non e' configurato: i Dev Services alzano
# automaticamente questo container e ne iniettano url/utente/password.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16

quarkus.http.port=8080

# In produzione (container) tutto arriva da variabili d'ambiente
%prod.quarkus.datasource.jdbc.url=${FINAHELP_DB_URL}
%prod.quarkus.datasource.username=${FINAHELP_DB_USER}
%prod.quarkus.datasource.password=${FINAHELP_DB_PASSWORD}

# Upload degli estratti conto: file piccoli, ma alzo il limite di default (10M)
quarkus.http.limits.max-body-size=20M

quarkus.log.category."it.finahelp".level=DEBUG
%prod.quarkus.log.category."it.finahelp".level=INFO
